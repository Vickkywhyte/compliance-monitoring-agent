[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-agent"
version = "0.1.0"
description = "Autonomous EU regulatory compliance monitoring agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.2",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "defusedxml>=0.7.1",
    "beautifulsoup4>=4.12.3",
    "sentence-transformers>=3.2.1",
    "chromadb>=0.5.20",
    "ulid-py>=1.1.0",
    "pyyaml>=6.0.2",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "pre-commit>=4.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: marks tests that call a real LLM (deselect with -m 'not llm')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests
