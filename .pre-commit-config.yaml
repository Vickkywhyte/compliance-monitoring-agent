repos:
  # Standard file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # Secret scanner (C-09)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # CHANGELOG enforcement (Lesson 7)
  # Fails if src/ or scripts/ is changed without touching CHANGELOG.md
  - repo: local
    hooks:
      - id: require-changelog
        name: Require CHANGELOG.md update with code changes
        language: python
        entry: python scripts/check_changelog.py
        pass_filenames: false
        always_run: true
