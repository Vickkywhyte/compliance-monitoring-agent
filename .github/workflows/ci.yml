name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # No live LLM calls in CI — use fixture mode (C-32: lockfile-only installs)
  USE_HOSTED: "false"
  FIXTURE_MODE: "true"
  PYTHONPATH: src

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from lockfile (C-32)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (no llm marker)
        run: |
          python -m pytest tests/ -q -m "not llm" --tb=short

      - name: Run security tests
        run: |
          python -m pytest tests/security/ -v --tb=short

  security-audit:
    name: Dependency audit (C-31)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Run pip-audit (fail on HIGH severity)
        run: |
          # chromadb CVEs require trust_remote_code=True or multi-tenant RBAC —
          # neither is used here (local single-tenant deployment, ADR-003).
          # setuptools PYSEC-2026-3447 affects sdist builds on macOS only; we do
          # not publish packages from CI.
          IGNORE="--ignore-vuln PYSEC-2024-230"
          IGNORE="$IGNORE --ignore-vuln PYSEC-2026-311"
          IGNORE="$IGNORE --ignore-vuln PYSEC-2026-3813"
          IGNORE="$IGNORE --ignore-vuln PYSEC-2026-3814"
          IGNORE="$IGNORE --ignore-vuln PYSEC-2026-3815"
          IGNORE="$IGNORE --ignore-vuln PYSEC-2026-3447"
          pip-audit --requirement requirements.lock --desc on $IGNORE
          pip-audit --desc on $IGNORE

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    # Only run on main to avoid burning time on every draft PR
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t compliance-agent:ci .

      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python compliance-agent:ci \
            -c "import compliance_agent; print('import OK')"
